<!DOCTYPE html>
<html>
<head>
  	<meta charset="utf-8">
  	<meta name="viewport" content="initial-scale=1, width=device-width">
  	
  	<link rel="stylesheet"  href="/Styles/desktop-css/d-resetpassword.css" />
  	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;500;600;700&display=swap" />
  	
  	<link rel="stylesheet" href="../SIKHAY-STYLE/ResetPasswordPage.css">
  	<title>SIKHAY-Reset-Password</title>
  <link rel="icon" type="image/x-icon" href="../SIKHAY-ASSETS/SIKHAYLOGO.PNG">
</head>
<body>
  	
  	<div class="desktop">
    	<img src="../SIKHAY-ASSETS/reset-password/Don-Honorio-Ventura-State-University_8b0167a5305778d81713f6e47ec6de10.jpg" class="desktop-child" alt="">
    		
		<div class="reset-password-wrapper">
    		<div class="reset-password-parent">
      			<div class="reset-password">Reset Password</div>
      			<div class="rectangle-parent">
        			<button class="group-child">
						<b class="confirm">Confirm</b>
					</button>
      			</div>
      			<div class="group-parent">
    				<div class="frame-parent">
      					<div class="group-item"></div>
          				<div class="new-password-parent">
    						<div class="new-password">New Password</div>
            				<input id="newPass" type="password" class="password-parent" placeholder="Password">
              				<!--<img src="Assets/clarity_eye-hide-line.svg" class="clarityeye-hide-line-icon" alt=""> -->
        				</div>
    				</div>
    				<div class="confirm-password-parent">
      					<div class="new-password">Confirm Password</div>
        				<input id="conPass" type="password" class="password-parent" placeholder="Confirm Password">
    					<!--<img src="Assets/clarity_eye-hide-line.svg" class="clarityeye-hide-line-icon" alt=""> -->
    				</div>
  				</div>
			</div>
		</div>

    	<div class="company-parent">
        		<div class="company2">
           			<div class="pampanga-state-university">
              			© 2026 Pampanga State University. All Rights Reserved.
           			</div>
        		</div>
        		<div class="learn-more-group">
           			<div id="learn" class="learn-more">Learn more</div>
           			<div id="support" class="support2">Support</div>
           			<div id="tos" class="terms-and-conditions2">Terms and Conditions</div>
           			<div id="pp" class="privacy-policy2">Privacy Policy</div>
           			<div id="ref" class="references2">References</div>
        		</div>
     		</div>

     		<div class="social-links">
        		<img class="social-link-1" src="../SIKHAY-ASSETS/reset-password/facebook.svg" alt="Facebook">
        		<img class="social-link-2" src="../SIKHAY-ASSETS/reset-password/youtube.svg" alt="YouTube">
        		<img class="social-link-3" src="../SIKHAY-ASSETS/reset-password/email.svg" alt="Email">
     		</div>

			<script src="../SIKHAY-SCRIPT/ResetPasswordPage.js"></script>

</body>
</html>
