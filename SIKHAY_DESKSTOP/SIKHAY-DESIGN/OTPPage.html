    <main class="main-content">
        <div class="otp-card">
            <h1>OTP Verification</h1>
            <p>We have sent the verification code to<br>your email address</p>
            
            <div class="otp-inputs">
                <input id="first" class="otp-box" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="OTP digit 1">
                <input id="second" class="otp-box" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="OTP digit 2">
                <input id="third" class="otp-box" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1"  aria-label="OTP digit 3">
                <input id="last" class="otp-box" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="OTP digit 4">
            </div>

            <button class="confirm-btn">Confirm</button>
        </div>
    </main>
